version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "5054:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.3.5
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: ""
      CLUSTER_ID: ""
  mongo:
    image: mongo
    ports:
      - "7054:27017"
    volumes:
      - mongo_data:/data/db
  mqtt_kafka:
    build:
      context: ./cloud
      dockerfile: DockerFile.Kafka
    depends_on:
      - kafka
      - mosquitto
    restart: unless-stopped

  kafka_mongo:
    build:
      context: ./cloud
      dockerfile: DockerFile.Mongo
    depends_on:
      - kafka
      - mongo
    restart: unless-stopped

  web:
    build: 
     context: ./cloud/projeto_front
     dockerfile: DockerFile.App
    ports:
    - "7154:6054"
    depends_on:
    - mongo
volumes:
  mongo_data:
